display:
  - platform: ota5901
    id: ses_display
    sd_pin: GPIO4
    sclk_pin: GPIO5
    cs_pin: GPIO6
    reset_pin: GPIO7
    xclk_pin: GPIO10
    te_pin: GPIO1
    xclk_frequency: 28800
    spi_half_period_us: 1
    ready_timeout_ms: 5000
    te_delay_us: 50
    skip_unchanged: true
    update_interval: never
    lambda: |-
      it.fill(COLOR_OFF);
      
      if (id(screen_page) == 0) {
        // PAGE 0: clock + network status
        auto now = id(net_time).now();
        it.rectangle(0, 0, 256, 128);
        it.print(128, 4, id(font_small), TextAlign::TOP_CENTER, "OTA5901 / Universal v13");

        if (now.is_valid()) {
          it.printf(128, 25, id(font_big), TextAlign::TOP_CENTER,
                    "%02d:%02d", now.hour, now.minute);
          it.printf(128, 72, id(font_small), TextAlign::TOP_CENTER,
                    "%02d-%02d-%04d", now.day_of_month, now.month, now.year);
        } else {
          it.print(128, 38, id(font_medium), TextAlign::TOP_CENTER, "Waiting for NTP");
        }

        it.printf(6, 103, id(font_small), "WiFi %.0f dBm", id(wifi_rssi).state);
        it.printf(250, 103, id(font_small), TextAlign::TOP_RIGHT, "%s", id(device_ip).state.c_str());
        it.printf(100, 97, id(font_medium), "%.0f °C", id(temperature_ble_yard).state);

       
       } else if (id(screen_page) == 1) {
        // PAGE 1: device information
        it.rectangle(0, 0, 256, 128);
        it.print(8, 6, id(font_small), "SES display status");
        it.line(8, 31, 247, 31);
        it.printf(8, 39, id(font_small), "Controller: OTA5901");
        it.printf(8, 58, id(font_small), "Panel: 256x128 mono TFT");
        it.printf(8, 77, id(font_small), "XCLK: 28.8 kHz");
        it.printf(8, 96, id(font_small), "WiFi: %.0f dBm", id(wifi_rssi).state);
        it.printf(8, 113, id(font_small), "IP: %s", id(device_ip).state.c_str());

      } else if (id(screen_page) == 2) {
        // PAGE 2: ordinary ESPHome drawing API demo
        it.rectangle(0, 0, 256, 128);
        for (int x = 0; x < 256; x += 16)
          it.line(x, 0, x, 127);
        for (int y = 0; y < 128; y += 16)
          it.line(0, y, 255, y);
        it.line(0, 0, 255, 127);
        it.line(255, 0, 0, 127);
        it.filled_rectangle(12, 84, 60, 28);
        it.print(128, 48, id(font_small), TextAlign::CENTER, "ESPHome");

      } else if (id(screen_page) == 3) {
        // PAGE 3: uploader instructions. Actual images are uploaded at /ota5901.
        it.rectangle(0, 0, 256, 128);
        it.print(128, 20, id(font_small), TextAlign::TOP_CENTER, "Image uploader");
        it.print(128, 52, id(font_small), TextAlign::TOP_CENTER,
                 "Open in browser:");
        it.print(128, 72, id(font_small), TextAlign::TOP_CENTER,
                 "/ota5901");
        it.print(128, 99, id(font_small), TextAlign::TOP_CENTER,
                 "PNG / JPEG / WebP -> 1 bpp");
      

      } else if (id(screen_page) == 99) {
        if (id(msg_clear)) {
          it.fill(COLOR_OFF);
        }

        esphome::font::Font *fonts[3] = {
          id(font_small), id(font_medium), id(font_big)
        };
        auto pick_font = [&](int fid) -> esphome::font::Font * {
          if (fid >= 0 && fid < 3) return fonts[fid];
          return fonts[0];
        };

        // align: 0 = слева (используется x), 1 = центр (x игнорируется),
        //        2 = справа (x игнорируется)
        auto pick_align = [](int a) -> TextAlign {
          switch (a) {
            case 1:  return TextAlign::TOP_CENTER;
            case 2:  return TextAlign::TOP_RIGHT;
            default: return TextAlign::TOP_LEFT;
          }
        };

        auto resolve_x = [](int al, int x) -> int {
          if (al == 1) return 128;   // центр экрана
          if (al == 2) return 248;   // правый край
          return x;                  // align=0 — используем xN
        };

        auto draw_line = [&](const std::string &txt, int x, int y, int fid, int al) {
          if (txt.empty()) return;
          it.print(resolve_x(al, x), y, pick_font(fid), pick_align(al), txt.c_str());
        };

        draw_line(id(msg1_text), id(msg1_x), id(msg1_y), id(msg1_font), id(msg1_align));
        draw_line(id(msg2_text), id(msg2_x), id(msg2_y), id(msg2_font), id(msg2_align));
        draw_line(id(msg3_text), id(msg3_x), id(msg3_y), id(msg3_font), id(msg3_align));
        draw_line(id(msg4_text), id(msg4_x), id(msg4_y), id(msg4_font), id(msg4_align));
        draw_line(id(msg5_text), id(msg5_x), id(msg5_y), id(msg5_font), id(msg5_align));
        draw_line(id(msg6_text), id(msg6_x), id(msg6_y), id(msg6_font), id(msg6_align));
      }
     
button:
