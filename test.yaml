    name: "Display: Clock"
    id: clock_and_date
    on_press:
      - lambda: 'id(screen_page) = 0;'
      - component.update: ses_display

  - platform: template
    name: "Display: Info"
    on_press:
      - lambda: 'id(screen_page) = 1;'
      - component.update: ses_display

  - platform: template
    name: "Display: Drawing demo"
    on_press:
      - lambda: 'id(screen_page) = 2;'
      - component.update: ses_display

  - platform: template
    name: "Display: Image uploader info"
    on_press:
      - lambda: 'id(screen_page) = 3;'
      - component.update: ses_display

  - platform: template
    name: "Display: Refresh current page"
    on_press:
      - component.update: ses_display

  - platform: template
    name: "DEBUG: White"
    on_press:
      - lambda: |-
          id(ses_display).debug_fill_white();

  - platform: template
    name: "DEBUG: Black"
    on_press:
      - lambda: |-
          id(ses_display).debug_fill_black();

  - platform: template
    name: "DEBUG: Checkerboard 8x8"
    on_press:
      - lambda: |-
          id(ses_display).debug_checkerboard(8);

  - platform: template
    name: "DEBUG: Raw 0x0F stripes"
    on_press:
      - lambda: |-
          id(ses_display).debug_raw_fill(0x0F);

  - platform: template
    name: "DEBUG: Driver test pattern"
    on_press:
      - lambda: |-
          id(ses_display).debug_test_pattern();

  - platform: template
    name: "DEBUG: Hard re-init + current frame"
    on_press:
      - lambda: |-
          id(ses_display).debug_reinit_current();

  - platform: template
    name: "DEBUG: Read status 0x4A"
    on_press:
      - lambda: |-
          const uint16_t s = id(ses_display).debug_read_status();
          char text[12];
          snprintf(text, sizeof(text), "0x%04X", s);
          id(ota5901_status).publish_state(text);